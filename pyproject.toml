[project]
name = "phasefield"
version = "0.1.0"
description = "Optimisation topologique par champ de phase et PINN, en JAX (1D, 2D)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "optax>=0.2.3",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]   # plotphase.py (et figures écrites par phasefield.py sur place)

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
