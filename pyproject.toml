[project]
name = "pinn1d"
version = "0.1.0"
description = "Banc d'essai 1D : retrouver par PINN un design binaire à N interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "optax>=0.2.3",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
