[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phasefield"
version = "0.1.0"
description = "Optimisation topologique par champ de phase avec PINN (1D)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]
jax = ["jax>=0.4.30", "optax>=0.2.3"]   # pinn1d.py

[project.scripts]
phasefield-run = "phasefield.run:main"
phasefield-diagnose = "phasefield.diagnose:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
